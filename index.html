<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>은모도로</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column. Dial on top, controls under it, settings card last. Study = blue, break = green. */
:root {
  --bg: #f6f3f1;
  --surface: #ffffff;
  --fg: #231f1e;
  --muted: #7a706c;
  --line: #e4dedb;
  --study: #5578a6;
  --study-soft: #e6ecf3;
  --rest: #2c9a62;
  --rest-soft: #dff1e6;
  --phase: var(--study);
  --phase-soft: var(--study-soft);
  --font-text: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Manrope", "IBM Plex Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1817; --surface: #262221; --fg: #f3ece9; --muted: #a39792; --line: #3a3432;
    --study: #8aa8cf; --study-soft: #232c3a; --rest: #5fd69a; --rest-soft: #1c3427;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1817; --surface: #262221; --fg: #f3ece9; --muted: #a39792; --line: #3a3432;
  --study: #8aa8cf; --study-soft: #232c3a; --rest: #5fd69a; --rest-soft: #1c3427;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-text); font-size: 15px; line-height: 1.5;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.rest { --phase: var(--rest); --phase-soft: var(--rest-soft); }
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
header span { color: var(--muted); font-size: 13px; }

.dial { position: relative; width: min(100%, 320px); aspect-ratio: 1; margin: 0 auto; }
.dial svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.dial .track { fill: none; stroke: var(--line); stroke-width: 10; }
.dial .bar { fill: none; stroke: var(--phase); stroke-width: 10; stroke-linecap: round; transition: stroke 0.3s, stroke-dashoffset 0.3s linear; }
.dial .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.phase { font-size: 13px; font-weight: 600; color: var(--phase); background: var(--phase-soft); padding: 3px 12px; border-radius: 99px; }
.time { font-family: var(--font-num); font-weight: 800; font-size: clamp(54px, 18vw, 72px); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.sub { font-size: 13px; color: var(--muted); min-height: 20px; white-space: pre-line; line-height: 1.6; }

.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; min-height: 12px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; }
.dots i.done { background: var(--study); border-color: var(--study); }
.dots i.now { border-color: var(--phase); }
.counter { text-align: center; font-size: 14px; color: var(--muted); margin-top: -10px; }
.counter b { color: var(--fg); font-weight: 600; }

.controls { display: flex; gap: 10px; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-height: 48px; padding: 0 16px; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--phase); outline-offset: 2px; }
button.main { flex: 1; background: var(--phase); border-color: var(--phase); color: #fff; font-weight: 700; font-size: 16px; }
:root[data-theme="dark"] button.main { color: #1b1817; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.main { color: #1b1817; } }
button.main:hover { filter: brightness(1.06); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; flex-wrap: wrap; }
.row + .row { border-top: 1px solid var(--line); }
.row label, .row .lab { font-weight: 500; }
.row small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.step { display: flex; align-items: center; gap: 6px; }
.step button { width: 38px; min-height: 38px; padding: 0; font-size: 18px; line-height: 1; }
.step input { width: 58px; min-height: 38px; text-align: center; font: 700 16px var(--font-num); font-variant-numeric: tabular-nums; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; -moz-appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.unit { color: var(--muted); font-size: 13px; width: 18px; }
.step.off { opacity: 0.35; pointer-events: none; }

.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: background 0.2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--study); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 3px solid var(--phase); outline-offset: 2px; }
.locked { color: var(--muted); font-size: 12.5px; padding: 0 0 12px; }

.stats { display: flex; gap: 10px; }
.stats div { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.stats small { color: var(--muted); font-size: 12px; display: block; }
.stats b { font-family: var(--font-num); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.done-msg { background: var(--study-soft); color: var(--fg); border-radius: 12px; padding: 12px 16px; text-align: center; font-weight: 600; }
.todo-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0 6px; }
.todo-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
.todo-head span { font-size: 13px; color: var(--muted); }
.todo-add { display: flex; gap: 8px; padding: 6px 0 10px; }
.todo-add input { flex: 1; min-width: 0; min-height: 42px; padding: 0 12px; font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; }
.todo-add button { min-height: 42px; background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
ul.todo { list-style: none; margin: 0; padding: 0 0 6px; }
ul.todo li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
ul.todo input[type=checkbox] { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--study); cursor: pointer; }
ul.todo label { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
ul.todo li.done label { color: var(--muted); text-decoration: line-through; }
ul.todo button { min-height: 30px; width: 30px; padding: 0; border: none; background: none; color: var(--muted); font-size: 18px; line-height: 1; }
ul.todo button:hover { color: var(--study); }
.todo-empty { color: var(--muted); font-size: 13px; padding: 8px 0 14px; border-top: 1px solid var(--line); }
.todo-foot { padding: 4px 0 12px; text-align: right; }
.todo-foot button { min-height: 32px; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.cat-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.head-r { display: flex; align-items: center; gap: 12px; line-height: 20px; }
.head-r span { line-height: 20px; }
.cat-count { opacity: 0.55; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat-count b { font-family: var(--font-text); font-size: 13px; font-weight: 600; color: var(--fg); }
.cat-layer .cat { position: absolute; width: var(--cs); min-height: 0; padding: 0; border: none; background: none; border-radius: 0; pointer-events: auto; cursor: pointer; transform: scale(0); transition: transform 0.22s cubic-bezier(.3,1.6,.5,1); will-change: transform; -webkit-tap-highlight-color: transparent; }
.cat-layer .cat.in { transform: scale(1); }
.cat-layer .cat, .cat-layer .cat:hover, .cat-layer .cat:focus, .cat-layer .cat:focus-visible, .cat-layer .cat:active { outline: none !important; box-shadow: none; border: none; background: transparent; -webkit-appearance: none; appearance: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.cat-layer .cat.out { pointer-events: none; }
.cat-layer .cat img { filter: drop-shadow(0 4px 8px rgba(0,0,0,.28)); width: 100%; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
</style>

<main>
  <header>
    <h1>은모도로</h1>
    <div class="head-r"><span class="cat-count" id="catCount" aria-label="잡은 고양이 수" hidden>🐱 <b id="catN">0</b></span><span id="stateNote">대기 중</span></div>
  </header>

  <div class="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="90"></circle>
      <circle class="bar" id="bar" cx="100" cy="100" r="90"></circle>
    </svg>
    <div class="inner">
      <span class="phase" id="phase">공부</span>
      <div class="time" id="time" role="timer" aria-live="off">25:00</div>
      <div class="sub" id="sub"></div>
    </div>
  </div>

  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="counter" id="counter"></div>
  <div id="doneMsg" class="done-msg" hidden>목표 세트를 모두 끝냈어요. 수고했어요!</div>

  <div class="controls">
    <button id="reset" type="button">처음으로</button>
    <button id="go" type="button" class="main">시작</button>
    <button id="skip" type="button" title="지금 단계를 건너뛰고 다음으로">건너뛰기</button>
  </div>

  <div class="stats">
    <div><small>끝낸 세트</small><b id="statSets">0</b></div>
    <div><small>공부한 시간</small><b id="statTime">0분</b></div>
  </div>

  <section class="card" aria-label="할 일">
    <div class="todo-head"><h2>이번 세션 할 일</h2><span id="todoCount"></span></div>
    <form class="todo-add" id="todoForm">
      <input id="todoInput" type="text" maxlength="80" placeholder="힘을 내기!!!✊" autocomplete="off" aria-label="할 일 입력">
      <button type="submit">추가</button>
    </form>
    <ul class="todo" id="todoList"></ul>
    <div class="todo-empty" id="todoEmpty">아직 할 일이 없어요. 작게 쪼개서 적어 보세요.</div>
    <div class="todo-foot" id="todoFoot" hidden><button type="button" id="todoClear">완료한 항목 지우기</button></div>
  </section>

  <section class="card" aria-label="설정">
    <div class="row">
      <label for="studyMin">한 세트 공부 시간</label>
      <div class="step" data-for="studyMin">
        <button type="button" data-d="-5" aria-label="5분 줄이기">−</button>
        <input id="studyMin" type="number" inputmode="numeric" min="1" max="180" value="25">
        <button type="button" data-d="5" aria-label="5분 늘리기">+</button>
        <span class="unit">분</span>
      </div>
    </div>
    <div class="row">
      <label for="breakMin">쉬는 시간</label>
      <div class="step" data-for="breakMin">
        <button type="button" data-d="-1" aria-label="1분 줄이기">−</button>
        <input id="breakMin" type="number" inputmode="numeric" min="1" max="60" value="5">
        <button type="button" data-d="1" aria-label="1분 늘리기">+</button>
        <span class="unit">분</span>
      </div>
    </div>
    <div class="row">
      <span class="lab" id="goalLabel">목표 세트 정하기<small>끄면 멈출 때까지 계속 돌아요</small></span>
      <div class="switch"><input id="goalOn" type="checkbox" aria-labelledby="goalLabel"><span></span></div>
    </div>
    <div class="row" id="goalRow">
      <label for="goalSets">반복할 세트 수</label>
      <div class="step" data-for="goalSets" id="goalStep">
        <button type="button" data-d="-1" aria-label="세트 줄이기">−</button>
        <input id="goalSets" type="number" inputmode="numeric" min="1" max="99" value="4">
        <button type="button" data-d="1" aria-label="세트 늘리기">+</button>
        <span class="unit">세트</span>
      </div>
    </div>
    <div class="row">
      <span class="lab" id="autoLabel">다음 단계 자동 시작<small>끄면 단계가 끝날 때마다 멈춰요</small></span>
      <div class="switch"><input id="autoNext" type="checkbox" checked aria-labelledby="autoLabel"><span></span></div>
    </div>
    <div class="row">
      <span class="lab" id="catLabel">쉬는 시간 고양이 모드<small>쉬는 시간에 고양이가 여기저기 나타나요. 눌러서 잡아 보세요</small></span>
      <div class="switch"><input id="catOn" type="checkbox" checked aria-labelledby="catLabel"><span></span></div>
    </div>
    <div class="row" id="lockedRow" hidden><span class="locked">타이머가 돌아가는 동안에는 설정을 바꿀 수 없어요. 일시정지하면 바꿀 수 있어요.</span></div>
  </section>
</main>
<div class="cat-layer" id="catLayer" aria-hidden="true"></div>

  var caught = 0;
  var catOn = false, catTimers = [], catActive = [], wavePending = 0, lastPts = [];
  function catLater(fn, ms) { var t = setTimeout(fn, ms); catTimers.push(t); return t; }
  function catRemove(b) {

    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 240);

  }

    var vw = window.innerWidth, vh = window.innerHeight;
    var base = Math.min(110, Math.max(72, vw * 0.22));
    var size = Math.round(base * (0.85 + Math.random() * 0.3));
    var x = 0, y = 0;
    for (var t = 0; t < 12; t++) {
      x = 8 + Math.random() * Math.max(1, vw - size - 16);
      y = 8 + Math.random() * Math.max(1, vh - size - 16);
      var clash = catActive.concat([]).some(function (c) { return Math.hypot(x - c._x, y - c._y) < size * 1.1; });
      lastPts.forEach(function (q) { if (Math.hypot(x - q[0], y - q[1]) < size * 0.8) clash = true; });
      if (!clash) break;
    }
    lastPts.push([x, y]); if (lastPts.length > 3) lastPts.shift();
    var b = document.createElement("button");
    b.type = "button"; b.className = "cat"; b.setAttribute("aria-label", "고양이 잡기");
    b._x = x; b._y = y;
    b.style.left = x + "px"; b.style.top = y + "px"; b.style.setProperty("--cs", size + "px");
    var img = document.createElement("img"); img.src = CATS[idx]; img.alt = ""; img.draggable = false;
    b.appendChild(img);
    $("catLayer").appendChild(b);
    catActive.push(b);
    requestAnimationFrame(function () { requestAnimationFrame(function () { b.classList.add("in"); }); });
    b.addEventListener("click", function () {
      if (catActive.indexOf(b) < 0) return;

    catLater(function () { catRemove(b); }, 1500 + Math.random() * 1800);
  }
  // 한 번에 1~3마리가 시차를 두고 나타나고, 모두 사라지면 다음 무리가 나온다.
  function catWave() {
    if (!catOn) return;
    var n = 1 + Math.floor(Math.random() * 3);
    var order = CATS.map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; });
    wavePending = n;
    var at = 0;
    for (var i = 0; i < n; i++) {

      else if (!S.running && !S.finished && ((key === "study" && S.phase === "study") || (key === "rest" && S.phase === "break"))) {
        // 일시정지 중에 지금 단계의 길이를 바꾸면, 이미 지난 시간은 그대로 두고 새 길이에 맞춰 남은 시간만 다시 계산한다.
        var passed = Math.max(0, S.total - S.left);
        S.total = phaseSecs(S.phase); S.left = Math.max(1, S.total - passed);
      }
      render(); });
  }
  bindNum("studyMin", "study", 1, 180);
  bindNum("breakMin", "rest", 1, 60);
  bindNum("goalSets", "goal", 1, 99);
  $("goalOn").checked = cfg.goalOn;
  $("autoNext").checked = cfg.auto;
  $("catOn").checked = cfg.cat;
  $("catOn").addEventListener("change", function () { cfg.cat = $("catOn").checked; saveCfg(); catSync(); });
  $("goalOn").addEventListener("change", function () { cfg.goalOn = $("goalOn").checked; saveCfg(); render(); });
  $("autoNext").addEventListener("change", function () { cfg.auto = $("autoNext").checked; saveCfg(); });
  document.querySelectorAll(".step").forEach(function (box) {
    var input = $(box.dataset["for"]);
    box.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        var d = parseInt(b.dataset.d, 10);
        input.value = (parseInt(input.value, 10) || 0) + d;
        input.dispatchEvent(new Event("change"));
      });
    });
  });

  // checklist
  var todos = [];
  try { var t = JSON.parse(localStorage.getItem("pomo-todo") || "[]"); if (Array.isArray(t)) todos = t; } catch (e) {}
  function saveTodos() { try { localStorage.setItem("pomo-todo", JSON.stringify(todos)); } catch (e) {} }
  function renderTodos() {
    var ul = $("todoList"); ul.innerHTML = "";
    todos.forEach(function (it, i) {
      var li = document.createElement("li"); if (it.done) li.className = "done";
      var cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "td" + i; cb.checked = !!it.done;
      cb.addEventListener("change", function () { it.done = cb.checked; saveTodos(); renderTodos(); });
      var lb = document.createElement("label"); lb.htmlFor = cb.id; lb.textContent = it.text;
      var del = document.createElement("button"); del.type = "button"; del.textContent = "×"; del.setAttribute("aria-label", "삭제");
      del.addEventListener("click", function () { todos.splice(i, 1); saveTodos(); renderTodos(); });
      li.appendChild(cb); li.appendChild(lb); li.appendChild(del); ul.appendChild(li);
    });
    var d = todos.filter(function (x) { return x.done; }).length;
    $("todoCount").textContent = todos.length ? d + " / " + todos.length + " 완료" : "";
    $("todoEmpty").hidden = todos.length > 0;
    $("todoFoot").hidden = d === 0;
  }
  $("todoForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("todoInput").value.trim(); if (!v) return;
    todos.push({ text: v, done: false }); $("todoInput").value = ""; saveTodos(); renderTodos();
  });
  $("todoClear").addEventListener("click", function () { todos = todos.filter(function (x) { return !x.done; }); saveTodos(); renderTodos(); });
  renderTodos();

  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.running) update(); });
  idle(); render();
})();
</script>

</body></html>
